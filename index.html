<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teorema de Pitágoras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <p class="texto-creditos">Desenvolvido pelo professor Jeiverson Christian</p>
        <div class="links-redes">
            <a href="https://www.youtube.com/@jeiversonchristian" target="_blank" rel="noopener noreferrer">Meu Canal no YouTube</a>
            <a href="https://www.instagram.com/jeiverson_christian/" target="_blank" rel="noopener noreferrer">Meu Instagram</a>
        </div>
    </header>

    <main class="container-inicial">
        <h1>Teorema de Pitágoras</h1>
        <!-- Substitua pelo caminho real da sua imagem do Pitágoras -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Kapitolinischer_Pythagoras_adjusted.jpg" alt="Busto de Pitágoras" class="imagem-pitagoras">
        
        <p>Aprenda de forma interativa como a soma dos quadrados dos catetos é igual ao quadrado da hipotenusa!</p>
        
        <a href="simulador.html" class="btn-play" id="btnPlay">▶ PLAY</a>
    </main>

    <!-- Mágica do som no botão Play -->
    <script>
        document.getElementById('btnPlay').addEventListener('click', function(e) {
            e.preventDefault(); 
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 600;
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
            
            setTimeout(() => { window.location.href = this.href; }, 150);
        });
    </script>
</body>
</html>
